# n8n local (entorno 'local', §C-19.1) — mientras la VM Oracle no tenga capacidad (§C-16,
# D-7). Sin dominio ni TLS: solo localhost. Los workflows (D-6) tienen la URL de producción
# hardcodeada (https://ayudame-flowday.vercel.app) y usan la credencial nativa httpHeaderAuth
# (n8n/setup-credentials.sh) — para probarlos contra este stack local, edita la URL del nodo
# HTTP Request en la UI de n8n a http://host.docker.internal:3000 antes de ejecutar.
services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports: ['5678:5678']
    environment:
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      # Bloquea {{$env.X}} en las expresiones de los nodos (hardening D-6, igual que Oracle).
      # Los workflows no dependen de $env: la URL de la app está hardcodeada y el secreto de
      # /internal/* vive en la credencial nativa httpHeaderAuth (n8n/setup-credentials.sh).
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
    volumes: ['n8n_local_data:/home/node/.n8n']
    depends_on: [postgres]

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes: ['postgres_local_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  n8n_local_data: {}
  postgres_local_data: {}
