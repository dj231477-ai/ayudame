# Oracle Cloud Always Free (ARM A1) — orquestación FlowDay. SPEC §C-16.3, D-7.
# INV-8: este Postgres es SOLO para n8n; la base de producto es Supabase.
# E2: límites de CPU/memoria por contenedor. Esta VM usa 1 OCPU/6GB (mitad del
# tier Always Free de A1, ahora 2 OCPU/12GB total en la cuenta, §C-16.2); el otro
# 1 OCPU/6GB queda reservado para una segunda VM futura.
# Sin Ollama: descartado por completo (D-9, latencia 8-12 tok/s inaceptable), no
# solo por falta de espacio en esta VM. MiniMax M3 (de pago, gateado por flag) es
# el único fallback cuando Groq/Cerebras/Gemini agotan cuota (§C-10.3).
services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports: ['5678:5678']
    environment:
      - N8N_HOST=${DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMAIN}/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      # Bloquea {{$env.X}} en las expresiones de los nodos (hardening D-6). Los workflows
      # (incluido whatsapp-inbound, §C-13.10) no dependen de $env: la URL de la app está
      # hardcodeada y el secreto vive en credencial nativa de n8n (n8n/setup-credentials.sh).
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
    deploy:
      resources:
        limits: { cpus: '0.6', memory: 2.5g } # E2
    volumes: ['n8n_data:/home/node/.n8n']
    depends_on: [postgres]

  postgres:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    deploy:
      resources:
        limits: { cpus: '0.3', memory: 0.8g }
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n']
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: always
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on: [n8n]

volumes:
  n8n_data: {}
  postgres_data: {}
